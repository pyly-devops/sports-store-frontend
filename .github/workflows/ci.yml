# CI for the frontend build-artifact image (Milestone 6).
#
# Two jobs, and the split between them is the security boundary:
#
#   verify   runs on every pull request AND on every push to main. It holds
#            `contents: read` and nothing else, so it cannot even ask for an
#            OIDC token, let alone reach AWS.
#   publish  runs only on main, only after verify passed, and is the only job
#            in this repo that requests `id-token: write`.
#
# What actually stops a pull request from publishing is not the `if:` below -
# it is the trust policy on github-actions-sports-store-frontend-ecr-push,
# whose sub condition is
# `repo:pyly-devops/sports-store-frontend:ref:refs/heads/main`. A PR run's
# token carries `...:pull_request`, which never matches, so the AssumeRole
# call fails outright. The `if:` makes that visible in the file; it is not
# what makes it true.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a main run. A cancelled main run is a
# commit with no image in ECR, and because the next merge produces a different
# hash, nothing ever retroactively builds it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Fails if package.json and the lockfile disagree - the same guarantee
      # `npm ci` gives the Dockerfile's dependency layer.
      - run: npm ci

      # A bad import or syntax error fails here. This repo has no test suite
      # and no ESLint config; introducing ESLint means also choosing and
      # fixing against a rule set, which is a code-change PR wearing a CI
      # PR's clothes (Milestone 6 plan §4d). Recorded as a named gap, not
      # pretended away.
      - run: npm run build

      - run: docker build --platform linux/amd64 -t ci:${{ github.sha }} .

      # The image is FROM scratch: no shell, nothing to run, nothing to
      # smoke-test by execing into it. `docker build --output type=local` is
      # the only way to assert the layer actually holds a built bundle rather
      # than an empty COPY.
      - run: docker build --output type=local,dest=./out .

      - name: The artifact contains a built bundle
        run: test -f out/dist/index.html

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Matches var.app_components in sports-store-infrastructure.
      ECR_REPOSITORY: sports-store/frontend
    steps:
      - uses: actions/checkout@v4

      # No static AWS keys, ever (CLAUDE.md). vars.AWS_ACCOUNT_ID is a GitHub
      # Actions ORGANISATION variable, not a secret: an account id
      # authenticates as nothing and is already in git in the deployments
      # repo. It lives in one place so a new account is one edit rather than
      # seven PRs. The role name is written out because a reviewer should be
      # able to see what this file publishes as without opening settings.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-sports-store-frontend-ecr-push
          aws-region: us-east-1 # matches envs/prod/variables.tf

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute the tag
        id: tag
        run: |
          set -euo pipefail
          version=$(tr -d ' \n' < VERSION)
          case "$version" in
            latest|"") echo "::error::VERSION must not be '$version'"; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is not semver: '$version'"; exit 1 ;;
          esac
          # git's own answer, not ${GITHUB_SHA:0:7}. The workspace Makefile
          # uses --short=7 too, so the two can never disagree about a commit
          # even on the day git needs eight characters to disambiguate. The
          # gateway repo's FRONTEND_IMAGE_TAG pins to exactly this string.
          echo "tag=$version-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY:$TAG"

          # Plain docker build + push, NOT docker/build-push-action: buildx
          # pushes an image index carrying provenance attestations, which show
          # up in the ECR console as a phantom unknown/unknown platform next to
          # every image. If this ever moves to buildx for its cache backends,
          # it needs `provenance: false`.
          docker build --platform linux/amd64 -t "$image" .

          # ECR repositories are IMMUTABLE (Milestone 4). Re-running this
          # workflow on the same commit would otherwise die on a tag that
          # already exists - the least useful red X there is. Same guard as the
          # workspace Makefile's push_if_new.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "already in ECR, tag not moved: $image"
          else
            docker push "$image"
          fi

          # dispatch-gateway (below) fires the event that replaces the human
          # copying this into the gateway repo's FRONTEND_IMAGE_TAG. There is
          # and must never be a sports-store-deployments/environments/
          # production/images/frontend.yaml — the frontend is baked into the
          # gateway image at build time, never deployed as its own Helm
          # service, so it has no image-tag file of its own to write.
          echo "Pushed \`$TAG\` to \`$ECR_REPOSITORY\`" >> "$GITHUB_STEP_SUMMARY"

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # Fires a repository_dispatch at the gateway repo carrying the tag that was
  # just pushed. Separate job, same reasoning as bump-deployment elsewhere:
  # publish's AWS identity and this job's cross-repo dispatch identity stay on
  # different runners.
  dispatch-gateway:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {} # GITHUB_TOKEN cannot dispatch into another repo's default-branch workflow at any permission level.
    steps:
      # Mints a token scoped to exactly this App's installation on
      # sports-store-gateway — the App is also installed on
      # sports-store-deployments for the other five repos' bump-deployment
      # flow, which this job doesn't touch.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: pyly-devops
          repositories: sports-store-gateway

      # repository_dispatch only ever runs the workflow file on the
      # TARGET repo's default branch — frontend-bump.yml must already be
      # merged to gateway main before this ever fires, or the event lands on
      # nothing with no error anywhere. That ordering is why this PR is step
      # 5 of two, sequenced after the gateway PR, not parallel with it.
      - name: Dispatch to sports-store-gateway
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          gh api repos/pyly-devops/sports-store-gateway/dispatches \
            -f event_type=frontend-image \
            -f "client_payload[tag]=${TAG}"
